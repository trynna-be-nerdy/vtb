name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python backend ───────────────────────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (unit tests only — no live DB/Redis needed)
        run: pytest backend/ -x -q --ignore=backend/tests/integration
        env:
          DATABASE_URL: postgresql+asyncpg://vtb:vtbpassword@localhost:5432/vtb
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_BASE_URL: http://localhost:11434
          PIPELINE_API_KEY: ci-test-key

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://vtb:vtbpassword@localhost:5432/vtb
          REDIS_URL: redis://localhost:6379/0
          # Skip actual DB connections during CI build
          NEXT_PHASE: phase-production-build
